name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. `cancel-in-progress: true` looks like the
# right thing for a deploy pipeline and is actively harmful here: if a run is cancelled
# *after* actions/deploy-pages has created its Pages deployment, that deployment is
# orphaned in an in-progress state, and an orphaned deployment blocks every later one
# until each gives up at its own 600-second timeout.
#
# That is not hypothetical. On 2026-08-06 two sessions pushed to main minutes apart, the
# older run was cancelled mid-deployment, and the next four deploys failed — two on the
# queue timeout and two more because re-running a workflow cannot recover it: Pages keys a
# deployment by `pages_build_version`, which is the commit SHA, so a re-run tries to create
# a duplicate ID and is cancelled within seconds. Recovery needed a manual
# `POST /repos/:owner/:repo/pages/deployments/:sha/cancel` plus a fresh commit.
#
# GitHub's own Pages starter workflow uses `false` for this reason.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Do not add a `timeout:` input here expecting it to help. On 2026-08-06 Pages was
      # accepting deployments and taking longer than the action's ten-minute wait to process
      # them, so `timeout: 1800000` was tried — the log shows the input being received and
      # the action aborting after 602 seconds anyway. v4 ignores it. Waiting longer is not
      # something this workflow can ask for.
      #
      # If deploys are timing out again, the useful facts are: a deployment left mid-flight
      # blocks the next one; a re-run cannot clear it, because Pages keys a deployment by the
      # commit SHA and a duplicate ID is cancelled within seconds; the manual unblock is
      # `POST /repos/:owner/:repo/pages/deployments/:sha/cancel` followed by a fresh commit;
      # and a run reporting failure does not always mean the deployment failed — check
      # `GET /pages/deployments/:sha`, since a557c36 reported `succeed` after its own run
      # had logged "Canceling Pages deployment".
      - id: deploy
        uses: actions/deploy-pages@v4
